<!DOCTYPE html>
<html lang="ja">

<head>
  <title>スピード計算</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
      background: #fffbea;
      color: #333;
    }
    a { color: inherit; text-decoration: none; }
    .app { max-width: 640px; margin: 0 auto; padding: 16px; }
    .app-header h1 { margin: 0 0 16px; font-size: 1.8rem; text-align: center; }
    button { font: inherit; color: inherit; cursor: pointer; }

    /* Deck colors follow the common 計算カード convention. */
    .deck-red { --deck: #e8504f; --deck-soft: #fde4e3; }
    .deck-blue { --deck: #3a7bd5; --deck-soft: #e0ecfb; }
    .deck-yellow { --deck: #e3a90e; --deck-soft: #fdf2cf; }
    .deck-green { --deck: #2e9e5b; --deck-soft: #dcf3e5; }

    .step { font-size: 1.15rem; margin: 24px 0 8px; }
    .deck-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .deck {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 16px 8px; border: 4px solid transparent; border-radius: 16px;
      background: var(--deck-soft); box-shadow: 0 4px 0 var(--deck);
    }
    .deck.selected { border-color: var(--deck); }
    .deck-title { font-size: 1.4rem; font-weight: bold; color: var(--deck); }
    .deck-subtitle { font-weight: bold; }
    .deck-size { font-size: 0.9rem; opacity: 0.7; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 10px 16px; border: 3px solid #e0c97a; border-radius: 999px;
      background: #fff; font-weight: bold;
    }
    .chip.selected { background: #ffd84d; border-color: #e0a800; }

    .start { margin-top: 32px; text-align: center; }
    .start a, .big-button {
      display: inline-block; padding: 16px 48px; border: none; border-radius: 999px;
      background: #ff8a3d; color: #fff; font-size: 1.5rem; font-weight: bold;
      box-shadow: 0 5px 0 #d9661a;
    }
    .start a:active, .big-button:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9661a; }

    .play { text-align: center; }
    .ready, .finished { padding: 24px 0; }
    .ready-deck { font-size: 1.4rem; font-weight: bold; }
    .ready-count { font-size: 1.2rem; }
    .progress {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 1.2rem; font-weight: bold; margin-bottom: 12px;
    }
    /* Each clock glyph has a fixed cell width so mm:ss.s never shifts as digits change. */
    .clock { display: inline-flex; justify-content: center; font-variant-numeric: tabular-nums; }
    .clock-digit { display: inline-block; width: 0.66em; text-align: center; }
    .clock-separator { display: inline-block; width: 0.36em; text-align: center; }
    .progress .clock {
      padding: 4px 14px; border-radius: 999px; background: #fff;
      box-shadow: inset 0 0 0 3px #e0c97a; font-size: 1.4rem;
    }
    .card {
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 5 / 3; border-radius: 20px; user-select: none; cursor: pointer;
      background: #fff; border: 10px solid var(--deck);
      font-size: clamp(3rem, 16vw, 6rem); font-weight: bold; font-variant-numeric: tabular-nums;
    }
    .hint { font-size: 0.95rem; opacity: 0.7; }
    .finished-title { font-size: 2.2rem; font-weight: bold; margin: 0; }
    .finished-time { font-size: 2.6rem; font-weight: bold; color: #ff8a3d; margin: 8px 0; }
    .back { margin-top: 24px; }
    .back a { text-decoration: underline; opacity: 0.8; }
  </style>
</head>

<body>
  <script type="module">
    import { init } from "virtual:swift-wasm?js&product=WebApp";
    await init()
  </script>
</body>

</html>
