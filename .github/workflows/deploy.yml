name: Verify and deploy SpeedMath

on:
  push:
    branches: ["main", "staging", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [validate, staging, production]
        default: validate

permissions:
  contents: read

# Only the latest push matters: a newer run cancels any queued or in-progress one.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || github.event_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: swift:6.4.2
    env:
      WASM_SDK_URL: https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz
      WASM_SDK_CHECKSUM: 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build tools
        run: apt-get update && apt-get install -y binaryen curl zstd python3
      - name: Install Node for dependency scripts
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true
      # `swift sdk install <url>` crashes in its downloader inside the container, so download the
      # bundle with curl, verify it, and install from the local file.
      - name: Install Swift WASM SDK
        run: |
          curl -fsSL -o /tmp/wasm-sdk.artifactbundle.tar.gz "$WASM_SDK_URL"
          echo "$WASM_SDK_CHECKSUM  /tmp/wasm-sdk.artifactbundle.tar.gz" | sha256sum -c -
          swift sdk install /tmp/wasm-sdk.artifactbundle.tar.gz
          swift sdk list | tee /tmp/speedmath-sdks
          grep -Fx swift-6.4.2-RELEASE_wasm-embedded /tmp/speedmath-sdks
          command -v wasm-ld
      # Most of a cold build is compiling swift-syntax for the macros. Caching `.build` keyed on the
      # resolved dependencies lets later runs rebuild only the app and the libraries that changed.
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: swiftpm-build-swift-6.4.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-build-swift-6.4.2-
      - name: Install dependencies
        run: swift package resolve && pnpm install --frozen-lockfile
      - name: Test Swift
        run: swift test
      - name: Check generated licenses
        run: |
          cp public/licenses.html /tmp/speedmath-licenses.html
          python3 Scripts/generate-licenses.py
          diff -u /tmp/speedmath-licenses.html public/licenses.html
      - name: Build and inspect staging bundle
        run: |
          pnpm exec cf build --mode staging
          pnpm exec node Scripts/check-build.mjs staging
          pnpm exec cf deploy --prebuilt --mode staging --dry-run
      - name: Run browser and local Worker tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - name: Build production bundle
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'production')
        run: |
          pnpm exec cf build --mode production
          pnpm exec node Scripts/check-build.mjs production
      - name: Save validated bundle
        if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'production')) || (github.ref == 'refs/heads/staging' && (github.event_name == 'push' || inputs.target == 'staging'))
        uses: actions/upload-artifact@v7
        with:
          name: deploy-bundle
          path: .cloudflare/output
          include-hidden-files: true

  staging:
    needs: build
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || inputs.target == 'staging')
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: deploy-bundle
          path: .cloudflare/output
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec node Scripts/check-build.mjs staging
          pnpm exec cf deploy --prebuilt --mode staging

  production:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'production')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: deploy-bundle
          path: .cloudflare/output
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf deploy --prebuilt --mode production
