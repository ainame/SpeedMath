name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: swift:6.4.2
    env:
      WASM_SDK_URL: https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz
      WASM_SDK_CHECKSUM: 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install binaryen (wasm-opt) and curl
        run: apt-get update && apt-get install -y binaryen curl
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      # `swift sdk install <url>` crashes in its downloader inside the container, so download the
      # bundle with curl, verify it, and install from the local file.
      - name: Install Swift WASM SDK
        run: |
          curl -fsSL -o /tmp/wasm-sdk.artifactbundle.tar.gz "$WASM_SDK_URL"
          echo "$WASM_SDK_CHECKSUM  /tmp/wasm-sdk.artifactbundle.tar.gz" | sha256sum -c -
          swift sdk install /tmp/wasm-sdk.artifactbundle.tar.gz
          swift sdk list
      - name: Install dependencies
        run: swift package resolve && npm ci
      - name: Build
        run: npx vite build --base=/SpeedMath/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
